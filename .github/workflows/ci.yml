name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Version sync check
        run: node scripts/check-versions.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: OCR helper tests
        run: npm run test:ocr

      - name: Build
        run: npm run build

      - name: API integration tests
        run: npm run test:api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual and accessibility tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: subx:ci
          cache-from: type=gha,scope=subx-ci-docker
          cache-to: type=gha,mode=max,scope=subx-ci-docker

      - name: Start container and check health
        run: |
          docker run -d --name subx-ci -p 3000:3000 \
            -e SUBX_SECRET_KEY=ci-test-secret \
            -e NUXT_PUBLIC_TIME_ZONE=Asia/Shanghai \
            subx:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs subx-ci || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f subx-ci || true
