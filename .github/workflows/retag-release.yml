name: Retag Release Image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: '源镜像 tag，例如 sha-19f248e'
        required: true
        type: string
      target_tags:
        description: '目标 tag，逗号分隔，例如 v2.4.0,2.4.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag image
        shell: bash
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IFS=',' read -ra TAGS <<< "${{ inputs.target_tags }}"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/subx:${tag}" \
              "ghcr.io/${OWNER}/subx:${{ inputs.source_tag }}"
          done
