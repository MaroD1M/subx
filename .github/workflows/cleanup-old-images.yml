name: Cleanup Old Container Images

on:
  workflow_dispatch:
    inputs:
      keep_version:
        description: '额外保留的 tag，逗号分隔（可选）'
        required: false
        type: string
  schedule:
    - cron: '23 4 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-old-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete old tagged package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_KEEP: ${{ github.event.inputs.keep_version }}
        run: |
          set -euo pipefail
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          KEEP_FILE="$(mktemp)"

          RELEASES="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 3 --json tagName --jq '.[].tagName')"
          if [ -z "$RELEASES" ] && [ -z "${EXTRA_KEEP:-}" ]; then
            echo "::error::No releases found and no extra keep tags; refusing to delete everything."
            exit 1
          fi

          {
            echo latest
            if [ -n "${EXTRA_KEEP:-}" ]; then
              printf '%s\n' "$EXTRA_KEEP" | tr ',' '\n'
            fi
            if [ -n "$RELEASES" ]; then
              printf '%s\n' "$RELEASES" | while IFS= read -r tag; do
                printf '%s\n%s\n' "$tag" "${tag#v}"
              done
            fi
          } | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sort -u > "$KEEP_FILE"

          echo "Preserving tags:"
          cat "$KEEP_FILE"

          # Legacy standalone sidecar images are no longer published. Remove all their versions.
          for pkg in subx-asr subx-ocr; do
            echo "::group::Remove legacy package $pkg"
            if ! gh api --paginate "users/$OWNER_LOWER/packages/container/$pkg/versions?per_page=100" \
              --jq '.[].id' > /tmp/legacy-versions.txt 2>/tmp/legacy.err; then
              echo "Skip $pkg: $(cat /tmp/legacy.err)"
              echo "::endgroup::"
              continue
            fi
            count=$(grep -c . /tmp/legacy-versions.txt 2>/dev/null || true)
            echo "Removing $count versions from $pkg"
            export OWNER_LOWER pkg
            delete_legacy_version() {
              gh api --method DELETE "users/$OWNER_LOWER/packages/container/$pkg/versions/$1" >/dev/null 2>&1 || echo "  delete skipped $1"
            }
            export -f delete_legacy_version
            xargs -P 4 -n 1 bash -c 'delete_legacy_version "$0"' < /tmp/legacy-versions.txt
            echo "::endgroup::"
          done

          for pkg in subx; do
            echo "::group::Package $pkg"
            if ! gh api --paginate "users/$OWNER_LOWER/packages/container/$pkg/versions?per_page=100" \
              --jq '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv' > /tmp/versions.tsv 2>/tmp/versions.err; then
              echo "Skip $pkg: $(cat /tmp/versions.err)"
              echo "::endgroup::"
              continue
            fi

            while IFS=$'\t' read -r id tags; do
              [ -z "$id" ] && continue
              [ -z "$tags" ] && continue
              keep=0
              IFS=',' read -ra TAG_ARRAY <<< "$tags"
              for tag in "${TAG_ARRAY[@]}"; do
                if grep -Fxq "$tag" "$KEEP_FILE"; then
                  keep=1
                  break
                fi
              done
              if [ "$keep" -eq 0 ]; then
                echo "Deleting $pkg:$tags (version $id)"
                gh api --method DELETE "users/$OWNER_LOWER/packages/container/$pkg/versions/$id" >/dev/null 2>&1 || echo "  delete skipped"
              fi
            done < /tmp/versions.tsv
            echo "::endgroup::"
          done
