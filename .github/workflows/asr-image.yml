name: Build Optional ASR Sidecar Image

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: asr-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/subx-asr
          tags: |
            type=raw,value=latest
            type=match,pattern=v(.*),group=1
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push CPU ASR image
        uses: docker/build-push-action@v7
        with:
          context: ./asr-service
          file: ./asr-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=subx-asr
          cache-to: type=gha,mode=max,scope=subx-asr
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
