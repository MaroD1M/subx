name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [文档索引](https://github.com/MaroD1M/subx/blob/master/docs/README.md)，确认现有功能是否已经覆盖。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景和当前的不便，而不只是功能名称
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 SubX 如何工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或临时绕行方式
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 翻译 / 模型
        - 语音识别 ASR
        - 图像字幕 OCR
        - 媒体库 / 文件浏览
        - 核对 / 导出
        - 自动化 / 通知 / API
        - 部署 / 运维
        - 界面 / 移动端
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关项目、参考实现等
    validations:
      required: false
