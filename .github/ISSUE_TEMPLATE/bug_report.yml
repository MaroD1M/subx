name: Bug 报告
description: 报告可复现的功能异常或崩溃
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查看 [故障排查](https://github.com/MaroD1M/subx/blob/master/docs/troubleshooting.md)，并搜索现有 Issue。
        请勿粘贴 API Key、访问口令、私密字幕或完整媒体路径。
  - type: input
    id: version
    attributes:
      label: SubX 版本
      description: 设置页或镜像 tag 中的版本号
      placeholder: v2.10.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - 单镜像（内置 ASR/OCR）
        - 拆分部署（独立 ASR/OCR sidecar）
        - GPU / 增强 ASR
        - 本地开发（npm run dev）
        - 其他
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: 数据库
      options:
        - SQLite（默认）
        - PostgreSQL
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: NAS/主机型号、CPU、内存、架构、Docker 版本
      placeholder: N100 / 16GB / amd64 / Docker 27
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 选择 ...
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 任务日志、容器日志或界面截图；请先脱敏
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue 和故障排查文档
          required: true
        - label: 已移除日志中的密钥、口令和个人信息
          required: true
